# Production compose file — this is what users of the published image run.
services:
  openweights:
    image: ${OPENWEIGHTS_IMAGE:-amdlift/openweights:latest}
    # Uncomment to build locally instead of pulling:
    # build: .
    container_name: openweights
    restart: unless-stopped
    ports:
      - '${OPENWEIGHTS_PORT:-3000}:3000'
    environment:
      # Sets which calendar day a workout is filed under for new accounts.
      TZ: ${TZ:-UTC}
      # Nothing else is needed. Reaching the app by IP, hostname or VPN name
      # works as-is; cross-site form posts are still refused because the check
      # compares the browser's Origin against the host it connected to.
      #
      # Behind a reverse proxy, only set these if it does NOT forward the
      # original Host header:
      #   ORIGIN: https://gym.example.com
      # Or list extra public addresses (comma-separated):
      #   TRUSTED_ORIGINS: https://gym.example.com,https://gym.tailnet.ts.net
      #
      # A TLS-terminating proxy should forward X-Forwarded-Proto (most do by
      # default) so the session cookie is marked Secure.
    volumes:
      - openweights-data:/data
    # If you swap the named volume for a bind mount, uncomment this and set it
    # to the owner of the host directory:
    # user: "1000:1000"

volumes:
  openweights-data:
